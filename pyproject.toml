[project]
name = "volunteer-manager"
version = "0.1.0"
description = "A portable volunteer and event management application."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# ``timezone.utc`` keeps the application executable on the local Python 3.10
# toolchain as well as the supported Python 3.13 runtime.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
