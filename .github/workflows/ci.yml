name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check .
      - name: Test
        run: pytest
      - name: Verify Alembic migrations are repeatable
        run: |
          database_path="$RUNNER_TEMP/stpride-migration-check.db"
          DATABASE_URL="sqlite:///$database_path" alembic upgrade head
          DATABASE_URL="sqlite:///$database_path" alembic upgrade head
