name: Deploy DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: stpride-volunteer-management
  ACR_NAME: acrstpridevolunteer-fcbqhwazhjgdbhbc
  ACR_LOGIN_SERVER: acrstpridevolunteer-fcbqhwazhjgdbhbc.azurecr.io

jobs:
  build-and-deploy:
    name: Build and deploy DEV
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          ACR_NAME="${{ secrets.AZURE_CONTAINER_REGISTRY }}"
          ACR_NAME="${ACR_NAME%%.azurecr.io}"
          az acr login --name "$ACR_NAME"

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
