name: Deploy DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: stpride-volunteer-management
  ACR_NAME: acrstpridevolunteer
  ACR_LOGIN_SERVER: acrstpridevolunteer.azurecr.io

jobs:
  build-and-deploy:
    name: Build and deploy DEV
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          ACR_NAME="${{ secrets.AZURE_CONTAINER_REGISTRY }}"
          ACR_NAME="${ACR_NAME%%.azurecr.io}"
          az acr login --name "$ACR_NAME"

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: ${{ env.ACR_LOGIN_SERVER }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          buildArguments: |
            APP_VERSION=${{ github.sha }}

      - name: Health check DEV deployment
        env:
          DEV_APP_URL: ${{ secrets.DEV_APP_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          if [ -z "$DEV_APP_URL" ]; then
            echo "DEV_APP_URL environment secret is required." >&2
            exit 1
          fi

          base_url="${DEV_APP_URL%/}"
          actual_version=""
          for attempt in $(seq 1 36); do
            health_json=$(curl --fail --silent --show-error "$base_url/healthz" || true)
            actual_version=$(printf '%s' "$health_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)
            if [ "$actual_version" = "$EXPECTED_VERSION" ]; then
              break
            fi
            echo "Waiting for expected revision ($attempt/36); currently '${actual_version:-unavailable}'."
            sleep 5
          done

          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "DEV revision mismatch: expected $EXPECTED_VERSION, got ${actual_version:-unavailable}." >&2
            exit 1
          fi

          curl --fail --silent --show-error "$base_url/health/live" >/dev/null
          ready_json=$(curl --fail --silent --show-error "$base_url/health/ready")
          ready_database=$(printf '%s' "$ready_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("database", ""))')
          if [ "$ready_database" != "connected" ]; then
            echo "DEV readiness check did not confirm database connectivity." >&2
            exit 1
          fi

          echo "DEV revision, liveness and readiness checks passed for $EXPECTED_VERSION."

      - name: Diagnose failed DEV revision
        if: failure()
        env:
          CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          latest_revision=$(az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "sort_by(@, &properties.createdTime)[-1].name" \
            --output tsv)

          if [ -z "$latest_revision" ]; then
            echo "::error title=DEV revision diagnostics::Azure returned no Container Apps revision."
            exit 0
          fi

          revision_state=$(az containerapp revision show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$latest_revision" \
            --query "{revision:name,active:properties.active,health:properties.healthState,provisioning:properties.provisioningState,replicas:properties.replicas}" \
            --output json | tr '\n' ' ')
          echo "::error title=DEV revision diagnostics::$revision_state"

          az containerapp logs show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$latest_revision" \
            --type system \
            --tail 100 || true

          az containerapp logs show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --revision "$latest_revision" \
            --type console \
            --tail 150 || true
