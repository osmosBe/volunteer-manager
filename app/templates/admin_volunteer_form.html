{% extends "base.html" %}{% block content %}<h1>Ehrenamtliche Person anlegen</h1>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form class="row g-3" method="post"><div class="col-12"><label class="form-label">Veranstaltung<select class="form-select" required name="event_id"><option value="">Bitte wählen</option>{% for event in events %}<option value="{{ event.id }}">{{ event.name }}</option>{% endfor %}</select></label></div><div class="col-md-6"><label class="form-label">Vorname<input class="form-control" required name="first_name"></label></div><div class="col-md-6"><label class="form-label">Nachname<input class="form-control" required name="last_name"></label></div><div class="col-md-6"><label class="form-label">E-Mail<input class="form-control" required type="email" name="email"></label></div><div class="col-md-6"><label class="form-label">Telefon<input class="form-control" name="phone"></label></div><div class="col-md-6"><label class="form-label">Altersgruppe<select class="form-select" name="age_group"><option value="adult">18+</option><option value="age_16_17">16–17</option><option value="under_16">unter 16</option></select></label></div><div class="col-12"><button class="btn btn-primary">Person anlegen</button> <a class="btn btn-outline-secondary" href="/admin/ehrenamtliche">Abbrechen</a></div></form>{% endblock %}
