{% extends "base.html" %}
{% block content %}
  <h1>Anmeldung: {{ event.name }}</h1>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="needs-validation" novalidate>
    <fieldset class="mb-4"><legend class="h3">Schichten auswählen</legend>
      {% for shift in shifts %}<div class="form-check card p-3 mb-2"><input class="form-check-input" type="checkbox" name="shift_ids" value="{{ shift.id }}" id="shift-{{ shift.id }}"><label class="form-check-label ms-2" for="shift-{{ shift.id }}"><strong>{{ shift.title }}</strong><br>{{ shift.starts_at.strftime('%d.%m.%Y %H:%M') }}–{{ shift.ends_at.strftime('%H:%M') }} Uhr{% if shift.location %} · {{ shift.location }}{% endif %}</label></div>{% endfor %}
    </fieldset>
    <fieldset class="mb-4"><legend class="h3">Deine Daten</legend><div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="first_name">Vorname</label><input class="form-control" required id="first_name" name="first_name"></div>
      <div class="col-md-6"><label class="form-label" for="last_name">Nachname</label><input class="form-control" required id="last_name" name="last_name"></div>
      <div class="col-md-6"><label class="form-label" for="email">E-Mail-Adresse</label><input class="form-control" required type="email" id="email" name="email"></div>
      <div class="col-md-6"><label class="form-label" for="phone">Telefonnummer <span class="text-muted">(optional)</span></label><input class="form-control" id="phone" name="phone"></div>
      <div class="col-md-6"><label class="form-label" for="pronouns">Pronomen <span class="text-muted">(optional)</span></label><input class="form-control" id="pronouns" name="pronouns"></div>
    </div></fieldset>
    <div class="form-check mb-2"><input class="form-check-input" required type="checkbox" id="contact_consent" name="contact_consent" value="true"><label class="form-check-label" for="contact_consent">Ich stimme zu, für diese Veranstaltung kontaktiert zu werden.</label></div>
    <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="future_contact_consent" name="future_contact_consent" value="true"><label class="form-check-label" for="future_contact_consent">ST. PRIDE darf mich künftig über weitere Ehrenamtsmöglichkeiten informieren.</label></div>
    <button class="btn btn-primary btn-lg" type="submit">Verbindlich anmelden</button>
  </form>
{% endblock %}
