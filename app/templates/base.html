<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ request.state.app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    {% if request.state.demo_mode %}
      <aside class="alert alert-warning border-0 border-bottom rounded-0 text-center fw-semibold mb-0" role="status" aria-label="Demo-Modus" data-demo-mode-indicator>
        Demo-Modus aktiv – bitte keine echten personenbezogenen Daten eingeben.
      </aside>
    {% endif %}
    <main class="container py-4">
      <a class="d-inline-block mb-4" href="/" aria-label="Startseite"><img src="/branding/logo" alt="{{ request.state.app_name }}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='/static/images/logo.png';" style="display:block;max-height:72px;max-width:100%;width:auto;height:auto;"></a>
      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/forms.js"></script>
    <script src="/static/js/navigation.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
