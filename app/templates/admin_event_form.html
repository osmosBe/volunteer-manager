{% extends "base.html" %}{% block content %}<h1>{% if event %}Veranstaltung bearbeiten{% else %}Veranstaltung anlegen{% endif %}</h1>{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form method="post" class="row g-3">
<div class="col-md-8"><label class="form-label" for="name">Titel</label><input class="form-control" required id="name" name="name" value="{{ event.name if event else '' }}"></div><div class="col-md-4"><label class="form-label" for="slug">URL-Kürzel</label><input class="form-control" required pattern="[a-z0-9-]+" id="slug" name="slug" value="{{ event.slug if event else '' }}"></div>
<div class="col-12"><label class="form-label" for="short_description">Kurzbeschreibung</label><input class="form-control" maxlength="500" id="short_description" name="short_description" value="{{ event.short_description if event and event.short_description else '' }}"></div><div class="col-12"><label class="form-label" for="description">Öffentliche Beschreibung</label><textarea class="form-control" rows="6" id="description" name="description">{{ event.description if event and event.description else '' }}</textarea></div>
<div class="col-md-6"><label class="form-label" for="starts_at">Beginn</label><input class="form-control" type="datetime-local" id="starts_at" name="starts_at" value="{{ event.starts_at.strftime('%Y-%m-%dT%H:%M') if event and event.starts_at else '' }}"></div><div class="col-md-6"><label class="form-label" for="ends_at">Ende</label><input class="form-control" type="datetime-local" id="ends_at" name="ends_at" value="{{ event.ends_at.strftime('%Y-%m-%dT%H:%M') if event and event.ends_at else '' }}"></div>
<div class="col-md-6"><label class="form-label" for="venue">Ort</label><input class="form-control" id="venue" name="venue" value="{{ event.venue if event and event.venue else '' }}"></div><div class="col-md-6"><label class="form-label" for="address">Adresse</label><input class="form-control" id="address" name="address" value="{{ event.address if event and event.address else '' }}"></div><div class="col-12"><label class="form-label" for="public_meeting_point">Allgemeiner Treffpunkt</label><input class="form-control" id="public_meeting_point" name="public_meeting_point" value="{{ event.public_meeting_point if event and event.public_meeting_point else '' }}"></div>
<div class="col-md-6"><label class="form-label" for="registration_opens_at">Anmeldung öffnet</label><input class="form-control" type="datetime-local" id="registration_opens_at" name="registration_opens_at" value="{{ event.registration_opens_at.strftime('%Y-%m-%dT%H:%M') if event and event.registration_opens_at else '' }}"></div><div class="col-md-6"><label class="form-label" for="registration_closes_at">Anmeldung schließt</label><input class="form-control" type="datetime-local" id="registration_closes_at" name="registration_closes_at" value="{{ event.registration_closes_at.strftime('%Y-%m-%dT%H:%M') if event and event.registration_closes_at else '' }}"></div>
<div class="col-md-4"><label class="form-label" for="contact_name">Kontaktname</label><input class="form-control" id="contact_name" name="contact_name" value="{{ event.contact_name if event and event.contact_name else '' }}"></div><div class="col-md-4"><label class="form-label" for="contact_email">Kontakt-E-Mail</label><input class="form-control" type="email" id="contact_email" name="contact_email" value="{{ event.contact_email if event and event.contact_email else '' }}"></div><div class="col-md-4"><label class="form-label" for="contact_phone">Kontakttelefon</label><input class="form-control" id="contact_phone" name="contact_phone" value="{{ event.contact_phone if event and event.contact_phone else '' }}"></div>
<div class="col-12"><label class="form-label" for="briefing">Allgemeines Briefing</label><textarea class="form-control" rows="4" id="briefing" name="briefing">{{ event.briefing if event and event.briefing else '' }}</textarea></div><div class="col-md-4"><label class="form-label" for="clothing_and_material">Kleidung und Material</label><textarea class="form-control" rows="4" id="clothing_and_material" name="clothing_and_material">{{ event.clothing_and_material if event and event.clothing_and_material else '' }}</textarea></div><div class="col-md-4"><label class="form-label" for="catering_info">Verpflegung</label><textarea class="form-control" rows="4" id="catering_info" name="catering_info">{{ event.catering_info if event and event.catering_info else '' }}</textarea></div><div class="col-md-4"><label class="form-label" for="accessibility_info">Barrierefreiheit</label><textarea class="form-control" rows="4" id="accessibility_info" name="accessibility_info">{{ event.accessibility_info if event and event.accessibility_info else '' }}</textarea></div>
<div class="col-md-5"><label class="form-label" for="status">Status</label><select class="form-select" id="status" name="status">{% for value in ['draft','registration_open','registration_closed','ongoing','completed','archived'] %}<option value="{{ value }}" {% if event and event.status.value == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-md-7 form-check align-self-end mb-2 ms-2"><input class="form-check-input" type="checkbox" value="true" id="is_public" name="is_public" {% if event and event.is_public %}checked{% endif %}><label class="form-check-label" for="is_public">Öffentlich sichtbar</label></div><div class="col-12"><button class="btn btn-primary" type="submit">Speichern</button> <a class="btn btn-outline-secondary" href="/admin">Abbrechen</a></div></form>{% endblock %}
