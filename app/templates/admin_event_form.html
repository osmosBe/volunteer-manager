{% extends "base.html" %}
{% block content %}
<h1>{% if event %}Veranstaltung bearbeiten{% else %}Veranstaltung anlegen{% endif %}</h1>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="row g-3">
  <div class="col-12"><label class="form-label" for="name">Titel</label><input class="form-control" required id="name" name="name" value="{{ event.name if event else '' }}"></div>
  <div class="col-12"><label class="form-label" for="slug">URL-Kürzel</label><input class="form-control" required pattern="[a-z0-9-]+" id="slug" name="slug" value="{{ event.slug if event else '' }}" aria-describedby="slug-help"><div id="slug-help" class="form-text">Nur Kleinbuchstaben, Zahlen und Bindestriche.</div></div>
  <div class="col-md-6"><label class="form-label" for="starts_at">Beginn</label><input class="form-control" type="datetime-local" id="starts_at" name="starts_at" value="{{ event.starts_at.strftime('%Y-%m-%dT%H:%M') if event and event.starts_at else '' }}"></div>
  <div class="col-md-6"><label class="form-label" for="ends_at">Ende</label><input class="form-control" type="datetime-local" id="ends_at" name="ends_at" value="{{ event.ends_at.strftime('%Y-%m-%dT%H:%M') if event and event.ends_at else '' }}"></div>
  <div class="col-md-7"><label class="form-label" for="venue">Ort</label><input class="form-control" id="venue" name="venue" value="{{ event.venue if event and event.venue else '' }}"></div>
  <div class="col-md-5"><label class="form-label" for="status">Status</label><select class="form-select" id="status" name="status">{% for value in ['draft','registration_open','registration_closed','ongoing','completed','archived'] %}<option value="{{ value }}" {% if event and event.status.value == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
  <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" value="true" id="is_public" name="is_public" {% if event and event.is_public %}checked{% endif %}><label class="form-check-label" for="is_public">Öffentlich sichtbar</label></div>
  <div class="col-12"><button class="btn btn-primary" type="submit">Speichern</button> <a class="btn btn-outline-secondary" href="/admin">Abbrechen</a></div>
</form>
{% endblock %}
