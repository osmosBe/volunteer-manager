services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-volunteer}"
      POSTGRES_USER: "${POSTGRES_USER:-volunteer}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  volunteer-manager:
    build: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Keep the raw PostgreSQL password and URL-encoded DATABASE_URL separate:
      # reserved characters in passwords cannot be safely interpolated into a URL.
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL with host postgres in .env}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8000}"
      AUTH_MODE: "${AUTH_MODE:-oidc}"
      DEMO_MODE: "${DEMO_MODE:-false}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      OIDC_ROLE_CLAIMS: "${OIDC_ROLE_CLAIMS:-roles}"
      OIDC_GROUP_CLAIMS: "${OIDC_GROUP_CLAIMS:-groups}"
      MAIL_PROVIDER: "${MAIL_PROVIDER:-console}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
