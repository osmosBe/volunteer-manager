services:
  volunteer-manager:
    build: ..
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "sqlite:////data/volunteer.db"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8000}"
      AUTH_MODE: "${AUTH_MODE:-oidc}"
      DEMO_MODE: "${DEMO_MODE:-false}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email}"
      OIDC_ROLE_CLAIMS: "${OIDC_ROLE_CLAIMS:-roles}"
      OIDC_GROUP_CLAIMS: "${OIDC_GROUP_CLAIMS:-groups}"
      MAIL_PROVIDER: "${MAIL_PROVIDER:-console}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"
    volumes:
      - volunteer-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  volunteer-data:
