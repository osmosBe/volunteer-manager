services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "sqlite:////data/app.db"
    volumes:
      - app-data:/data

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Volunteer Manager"
      MAIL_FROM_NAME: "Volunteer Manager"
      APP_VERSION: "0.1.0"
      ENVIRONMENT: "development"
      DATABASE_URL: "sqlite:////data/app.db"
    volumes:
      - app-data:/data

volumes:
  app-data:
